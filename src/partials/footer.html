<footer class="footer">
  <div class=" footer__container container">

    <div class="footer__top">
      <div class="footer__brand">
        <a class="footer__logo" href="/">
          <svg class="footer__logo-icon">
            <use href="./img/sprite.svg#icon-Company-Logo"></use>
          </svg>
        </a>

        <nav class="footer__nav" aria-label="Footer navigation">
          <ul class="footer__list">
            <li class="footer__item">
              <a class="footer__link" href="#home">Home</a>
            </li>
            <li class="footer__item">
              <a class="footer__link" href="#books">Books</a>
            </li>
            <li class="footer__item">
              <a class="footer__link" href="#feedbacks">Feedback</a>
            </li>
            <li class="footer__item">
              <a class="footer__link" href="#location">Location</a>
            </li>
          </ul>
        </nav>
      </div>

      <div class="footer__join">
        <h3 class="footer__title">Join</h3>
        <form class="footer__form" novalidate>
          <div class="footer__field">
            <label class="visually-hidden" for="footer-email">Email</label>
            <input
              class="footer__input"
              id="footer-email"
              type="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
              title="Enter a valid email, for example name@example.com"
              required />
            <button class="footer__button" type="submit">Sign Up</button>
          </div>
          <p class="footer__required">* Required field</p>
          <p class="footer__message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div class="footer__bottom">
      <p class="footer__copy">© 2025 Booksy. All rights reserved.</p>
    </div>
  </div>
</footer>
