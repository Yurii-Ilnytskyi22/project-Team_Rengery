
<footer class="footer">
  <div class="footer__container container">

    <div class="footer__top">
      <div class="footer__brand">
        <a class="footer__logo" href="/">
          <svg class="footer__logo-icon" width="84" height="36"
            viewBox="0.45 9.3 31.3 13.4">
            <use href="../img/sprite.svg#icon-Company-Logo" width="32"
              height="32"></use>
          </svg>
        </a>
        <nav class="footer__nav">
          <ul class="footer__list">
            <li class="footer__item"><a class="footer__link"
                href="#home">Home</a></li>
            <li class="footer__item"><a class="footer__link"
                href="#books">Books</a></li>
            <li class="footer__item"><a class="footer__link"
                href="#feedback">Feedback</a></li>
            <li class="footer__item"><a class="footer__link"
                href="#location">Location</a></li>
          </ul>
        </nav>
      </div>

      <div class="footer__join">
        <h3 class="footer__title">Join</h3>
        <form class="footer__form" novalidate>
          <div class="footer__field">
            <input
              class="footer__input"
              id="footer-email"
              type="email"
              name="email"
              placeholder="Enter your email*"
              autocomplete="email"
              required />
            <button class="footer__button" type="submit">Sign Up</button>
          </div>
          <p class="footer__required">* Required field</p>
          <p class="footer__message"></p>
        </form>
      </div>
    </div>

    <div class="footer__bottom">
      <p class="footer__copy">© 2025 Booksy. All rights reserved.</p>
    </div>

  </div>
</footer>
