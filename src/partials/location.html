<section class="location section" id="location">
  <div class="container">
    <div class="location__content">
      <div class="location__intro">
        <p class="location__eyebrow">Location</p>
        <h2 class="location__title">How to find us</h2>
        <p class="location__description">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse
          varius enim in eros elementum tristique.
        </p>
      </div>

      <address class="location__address">
        <ul class="location__list">
          <li class="location__item">
            <svg class="location__icon" width="16" height="16" aria-hidden="true">
              <use href="/img/sprite.svg#icon-envelope"></use>
            </svg>
            <div>
              <p class="location__label">Email</p>
              <a class="location__link" href="mailto:hello@booksy.com">hello@booksy.com</a>
            </div>
          </li>
          <li class="location__item">
            <svg class="location__icon" width="16" height="16" aria-hidden="true">
              <use href="/img/sprite.svg#icon-phone"></use>
            </svg>
            <div>
              <p class="location__label">Phone</p>
              <a class="location__link" href="tel:+612413043012">+61 (241) 304–3012</a>
            </div>
          </li>
          <li class="location__item">
            <svg class="location__icon" width="16" height="16" aria-hidden="true">
              <use href="/img/sprite.svg#icon-map"></use>
            </svg>
            <div>
              <p class="location__label">Office</p>
              <p class="location__text">123 Books St, Sydney NSW 2000 AU</p>
            </div>
          </li>
        </ul>
      </address>

      <div class="location__map">
        <iframe
          title="Booksy location: 123 Books St, Sydney NSW 2000 AU"
          src="https://www.google.com/maps?q=123%20Books%20St%2C%20Sydney%20NSW%202000%20AU&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </div>
</section>
