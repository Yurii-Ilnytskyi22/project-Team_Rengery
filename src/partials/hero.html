<section class="hero" id="home">
  <div class="container hero__container">
    <div class="swiper hero__slider">
      <ul class="swiper-wrapper hero__list">
        <li class="swiper-slide hero__slide">
          <img
            class="hero__image"
            srcset="
              /img/hero/banner1-mob-min.jpg    1x,
              /img/hero/banner1-mob@2x-min.jpg 2x
            "
            src="/img/hero/banner1-mob-min.jpg"
            alt="Open book, cozy blanket and cup of coffee"
            width="1312"
            height="390"
            fetchpriority="high"
          />

          <div class="hero__content">
            <p class="hero__offer">
              Get 10% off<span class="hero__desktop-break"><br /></span>
              your first order
            </p>
            <a href="#books" class="hero__shop-link"> Shop Now! </a>
          </div>
        </li>

        <li class="swiper-slide hero__slide">
          <img
            class="hero__image"
            srcset="
              /img/hero/banner2-mob-min.jpg    1x,
              /img/hero/banner2-mob@2x-min.jpg 2x
            "
            src="/img/hero/banner2-mob-min.jpg"
            alt="Book and glasses on a neutral background"
            width="1312"
            height="390"
            loading="lazy"
          />

          <div class="hero__content">
            <p class="hero__offer">Save 15% on some books</p>
            <a href="#books" class="hero__shop-link"> Shop Now! </a>
          </div>
        </li>

        <li class="swiper-slide hero__slide">
          <img
            class="hero__image"
            srcset="
              /img/hero/banner3-mob-min.jpg    1x,
              /img/hero/banner3-mob@2x-min.jpg 2x
            "
            src="/img/hero/banner3-mob-min.jpg"
            alt="Books on colorful library shelves"
            width="1312"
            height="390"
            loading="lazy"
          />

          <div class="hero__content">
            <p class="hero__offer">Summer Sale! Up to -40% discounts</p>
            <a href="#books" class="hero__shop-link"> Shop Now! </a>
          </div>
        </li>

        <li class="swiper-slide hero__slide">
          <img
            class="hero__image"
            srcset="
              /img/hero/banner4-mob-min.jpg    1x,
              /img/hero/banner4-mob@2x-min.jpg 2x
            "
            src="/img/hero/banner4-mob-min.jpg"
            alt="Open book, reading glasses and vase of flowers"
            width="1312"
            height="390"
            loading="lazy"
          />

          <div class="hero__content">
            <p class="hero__offer">Last chance to buy our spring bestsellers</p>
            <a href="#books" class="hero__shop-link"> Shop Now! </a>
          </div>
        </li>
      </ul>
    </div>

    <div class="hero__bottom">
      <h1 class="hero__title">Discover Your Next Great Read Today!</h1>

      <div class="hero__controls">
        <button
          class="hero__arrow hero__arrow--prev"
          type="button"
          aria-label="Previous slide"
          disabled
        >
          <svg
            class="hero__arrow-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/img/sprite.svg#icon-left-arrow-alt"></use>
          </svg>
        </button>

        <button
          class="hero__arrow hero__arrow--next"
          type="button"
          aria-label="Next slide"
        >
          <svg
            class="hero__arrow-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="/img/sprite.svg#icon-right-arrow-alt"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
