<section class="books" id="books">
  <div class="container books-container">
    <h2 class="visually-hidden">Trending books</h2>

    <div class="books-sidebar">
      <div class="books-heading">
        <h3 class="books-subtitle">Books</h3>

        <p class="books-counter">
          Showing
          <span class="books-shown">0</span>
          of
          <span class="books-total">0</span>
        </p>
      </div>

      <div class="books-filter">
        <button class="books-filter-toggle" type="button">
          <span>Categories</span>

          <svg class="books-filter-icon" width="24" height="24">
            <use href="./img/sprite.svg#icon-chevron-down"></use>
          </svg>
        </button>

        <ul class="books-categories"></ul>
      </div>
    </div>

    <div class="books-catalog">
      <ul class="books-list"></ul>

      <button class="books-show-more" type="button" hidden>Show More</button>
    </div>
  </div>
</section>
